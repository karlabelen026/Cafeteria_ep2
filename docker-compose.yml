# Levanta el stack completo de CafeGestion360 con un solo comando:
#   docker compose up --build -d
#
# Modo activo = lo que digas en tu .env local (nunca subido a git, ver
# .env.example en la raiz):
#   - SPRING_PROFILES_ACTIVE=noauth  -> sin Azure, H2 embebida (demo rapida).
#   - SPRING_PROFILES_ACTIVE= (vacio)-> valida JWT de Azure Entra ID real y
#     usa Postgres (servicio "postgres" de este mismo compose). Requiere
#     completar AZURE_ISSUER_URI / AZURE_AUDIENCES / AZURE_JWK_SET_URI (solo
#     tenants ciamlogin) / VITE_AZURE_* en tu .env
#     con los datos reales de tus App Registrations.

x-backend-common: &backend-common
  build:
    context: ./cafeteria-backend/cafeteria-backend
  restart: unless-stopped
  # Limite de memoria por contenedor: 9 JVM sueltas en una instancia pequena
  # (p.ej. la EC2 t3.large de la Fase 6) se matan entre si por OOM si no se
  # les pone techo (ver docs/EP2_PLAN.md seccion 8.1).
  mem_limit: 512m
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-noauth}
    JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
    DB_URL: jdbc:postgresql://postgres:5432/cafeteria
    DB_USER: cafeteria
    DB_PASSWORD: ${DB_PASSWORD:-cafeteria}
    AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-https://login.microsoftonline.com/<TENANT_ID>/v2.0}
    AZURE_AUDIENCES: ${AZURE_AUDIENCES:-api://cafeteria-backend}
    AZURE_JWK_SET_URI: ${AZURE_JWK_SET_URI:-}
    RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672,rabbitmq-3:5672
    RABBITMQ_USER: ${RABBITMQ_USER:-cafeteria}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cafeteria}

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafeteria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cafeteria}
    ports:
      - "5432:5432"
    volumes:
      - cafeteria_pgdata:/var/lib/postgresql/data
      - ./cafeteria-backend/cafeteria-backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cluster RabbitMQ de 3 nodos (ver docs/EP2_PLAN.md seccion 3 / Fase 2).
  # Peer discovery classic_config via ./rabbitmq/rabbitmq.conf (montado en
  # los 3). Solo rabbitmq-1 expone el puerto AMQP 5672 al host: los
  # microservicios se conectan por la red interna de Docker a los 3 nodos
  # (RABBITMQ_ADDRESSES), nunca necesitan el puerto publicado.
  rabbitmq-1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    # Sin limite, los 3 nodos podian crecer sin techo y, junto a las 11 JVMs
    # (cada una ya con su propio mem_limit), terminaban disparando la alarma
    # de memoria de RabbitMQ (system_memory_high_watermark) en el host (ver
    # docs/EP2_PLAN.md seccion 8.1 e infra/terraform, instance_type).
    mem_limit: 1g
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cafeteria_erlang_cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cafeteria}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cafeteria}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq-2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    mem_limit: 1g
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cafeteria_erlang_cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cafeteria}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cafeteria}
    ports:
      - "15673:15672"
    volumes:
      - rabbitmq_2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      rabbitmq-1:
        condition: service_healthy

  rabbitmq-3:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-3
    hostname: rabbitmq-3
    restart: unless-stopped
    mem_limit: 1g
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cafeteria_erlang_cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cafeteria}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cafeteria}
    ports:
      - "15674:15672"
    volumes:
      - rabbitmq_3_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      rabbitmq-1:
        condition: service_healthy

  ms-productos:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-productos
    container_name: ms-productos
    ports:
      - "8081:8081"
    volumes:
      - ms_productos_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-inventario:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-inventario
    container_name: ms-inventario
    ports:
      - "8082:8082"
    volumes:
      - ms_inventario_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-pedidos:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-pedidos
    container_name: ms-pedidos
    ports:
      - "8083:8083"
    volumes:
      - ms_pedidos_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-clientes:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-clientes
    container_name: ms-clientes
    ports:
      - "8084:8084"
    volumes:
      - ms_clientes_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-pagos:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-pagos
    container_name: ms-pagos
    ports:
      - "8085:8085"
    volumes:
      - ms_pagos_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-empleados:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-empleados
    container_name: ms-empleados
    ports:
      - "8086:8086"
    volumes:
      - ms_empleados_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-proveedores:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-proveedores
    container_name: ms-proveedores
    ports:
      - "8087:8087"
    volumes:
      - ms_proveedores_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-reportes:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-reportes
    container_name: ms-reportes
    ports:
      - "8088:8088"
    volumes:
      - ms_reportes_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-notificaciones:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-notificaciones
    container_name: ms-notificaciones
    ports:
      - "8089:8089"
    volumes:
      - ms_notificaciones_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-rabbitmq-admin:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: ms-rabbitmq-admin
    container_name: ms-rabbitmq-admin
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-noauth}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-https://login.microsoftonline.com/<TENANT_ID>/v2.0}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES:-api://cafeteria-backend}
      AZURE_JWK_SET_URI: ${AZURE_JWK_SET_URI:-}
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672,rabbitmq-3:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-cafeteria}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cafeteria}
      # Sin DB_URL/DB_USER/DB_PASSWORD: este microservicio no tiene base de
      # datos propia, es un proxy hacia RabbitMQ (ver docs/EP2_PLAN.md seccion 3.8).
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq-1:15672
    ports:
      - "8090:8090"
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bff-gateway:
    <<: *backend-common
    build:
      context: ./cafeteria-backend/cafeteria-backend
      args:
        MODULE: bff-gateway
    container_name: bff-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-noauth}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-https://login.microsoftonline.com/<TENANT_ID>/v2.0}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES:-api://cafeteria-backend}
      AZURE_JWK_SET_URI: ${AZURE_JWK_SET_URI:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # Vacio en local/Docker Compose (sin API Gateway delante): el filtro
      # OriginVerifyGlobalFilter no exige nada. En EC2, el API Gateway de
      # Terraform inyecta este mismo valor en cada peticion (ver
      # infra/terraform/apigateway.tf y docs/EP2_PLAN.md seccion 8.2).
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
      MS_PRODUCTOS_URL: http://ms-productos:8081
      MS_INVENTARIO_URL: http://ms-inventario:8082
      MS_PEDIDOS_URL: http://ms-pedidos:8083
      MS_CLIENTES_URL: http://ms-clientes:8084
      MS_PAGOS_URL: http://ms-pagos:8085
      MS_EMPLEADOS_URL: http://ms-empleados:8086
      MS_PROVEEDORES_URL: http://ms-proveedores:8087
      MS_REPORTES_URL: http://ms-reportes:8088
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8089
      MS_RABBITMQ_ADMIN_URL: http://ms-rabbitmq-admin:8090
    depends_on:
      ms-productos:
        condition: service_healthy
      ms-inventario:
        condition: service_healthy
      ms-pedidos:
        condition: service_healthy
      ms-clientes:
        condition: service_healthy
      ms-pagos:
        condition: service_healthy
      ms-empleados:
        condition: service_healthy
      ms-rabbitmq-admin:
        condition: service_healthy
      ms-proveedores:
        condition: service_healthy
      ms-reportes:
        condition: service_healthy
      ms-notificaciones:
        condition: service_healthy

  frontend:
    build:
      context: ./cafeteria-frontend/cafeteria-frontend
      args:
        VITE_AUTH_DISABLED: ${VITE_AUTH_DISABLED:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-placeholder}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-placeholder}
        VITE_AZURE_AUTHORITY: ${VITE_AZURE_AUTHORITY:-}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-http://localhost:4200}
        VITE_API_SCOPES: ${VITE_API_SCOPES:-api://cafeteria-backend/pedidos.read,api://cafeteria-backend/pedidos.write}
    container_name: cafeteria-frontend
    restart: unless-stopped
    # nginx escucha 80/443 dentro del contenedor (ver Dockerfile); en local
    # se mapea al 4200 de siempre para no romper las URLs ya documentadas.
    # Para HTTPS local, monta un volumen en /etc/nginx/certs con
    # fullchain.pem + privkey.pem y publica tambien el puerto 443.
    ports:
      - "4200:80"
    depends_on:
      - bff-gateway

volumes:
  cafeteria_pgdata:
  rabbitmq_1_data:
  rabbitmq_2_data:
  rabbitmq_3_data:
  ms_productos_data:
  ms_inventario_data:
  ms_pedidos_data:
  ms_clientes_data:
  ms_pagos_data:
  ms_empleados_data:
  ms_proveedores_data:
  ms_reportes_data:
  ms_notificaciones_data:
