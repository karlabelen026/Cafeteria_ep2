server:
  port: 8080

spring:
  application:
    name: bff-gateway
  cloud:
    gateway:
      routes:
        - id: ms-productos
          uri: ${MS_PRODUCTOS_URL:http://localhost:8081}
          predicates:
            - Path=/api/productos/**
        - id: ms-inventario
          uri: ${MS_INVENTARIO_URL:http://localhost:8082}
          predicates:
            # Las recetas (producto -> insumos) viven en ms-inventario bajo
            # /api/recetas: sin esta ruta el BFF respondia 404 y la pagina
            # de Recetas del dashboard nunca podia mostrar nada.
            - Path=/api/inventario/**,/api/recetas/**
        - id: ms-pedidos
          uri: ${MS_PEDIDOS_URL:http://localhost:8083}
          predicates:
            - Path=/api/pedidos/**
        - id: ms-clientes
          uri: ${MS_CLIENTES_URL:http://localhost:8084}
          predicates:
            - Path=/api/clientes/**
        - id: ms-pagos
          uri: ${MS_PAGOS_URL:http://localhost:8085}
          predicates:
            - Path=/api/pagos/**
        - id: ms-empleados
          uri: ${MS_EMPLEADOS_URL:http://localhost:8086}
          predicates:
            - Path=/api/empleados/**
        - id: ms-proveedores
          uri: ${MS_PROVEEDORES_URL:http://localhost:8087}
          predicates:
            - Path=/api/proveedores/**
        - id: ms-reportes
          uri: ${MS_REPORTES_URL:http://localhost:8088}
          predicates:
            - Path=/api/reportes/**
        - id: ms-pedidos-public
          uri: ${MS_PEDIDOS_URL:http://localhost:8083}
          predicates:
            - Path=/api/public/checkout,/api/public/pedidos/**
        - id: ms-notificaciones
          uri: ${MS_NOTIFICACIONES_URL:http://localhost:8089}
          predicates:
            - Path=/api/notificaciones/**,/api/public/tickets/**
        - id: ms-rabbitmq-admin
          uri: ${MS_RABBITMQ_ADMIN_URL:http://localhost:8090}
          predicates:
            - Path=/api/rabbitmq/**
      # CORS se configura en CorsConfig.java, dentro de la cadena de Spring
      # Security (ver SecurityConfig / NoAuthSecurityConfig) en vez de aqui:
      # un "globalcors" separado no alcanza a agregar los headers cuando
      # Security corta la respuesta con 401/403 antes de llegar a el.

  # NOTA: issuer-uri / audiences / jwk-set-uri NO se configuran aqui bajo
  # spring.security.oauth2.resourceserver.jwt.* — SecurityConfig.java arma su
  # propio bean ReactiveJwtDecoder leyendo AZURE_ISSUER_URI / AZURE_JWK_SET_URI /
  # AZURE_AUDIENCES directamente (ver el mismo comentario en cada ms-*/application.yml).

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: true
