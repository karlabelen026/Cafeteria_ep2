# Perfil de desarrollo SIN autenticacion (solo para probar localmente).
# Actívalo con: SPRING_PROFILES_ACTIVE=noauth
app.security.enabled=false
# Repite la exclusion de RabbitMQ de application.yml: esta propiedad la reemplaza completa.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
