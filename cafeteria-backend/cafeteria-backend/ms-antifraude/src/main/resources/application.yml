spring:
  application:
    name: ms-antifraude
  # Este microservicio no usa RabbitMQ: spring-rabbit llega solo como
  # dependencia transitiva de cafeteria-common. Sin esto, Spring Boot crea
  # una conexion a RabbitMQ y su health check deja el servicio en 503.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  # NOTA: issuer-uri / audiences / jwk-set-uri NO se configuran aqui: igual
  # que en los demas microservicios, SecurityConfig.java arma su propio
  # JwtDecoder leyendo AZURE_ISSUER_URI / AZURE_JWK_SET_URI / AZURE_AUDIENCES.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Productor del simulador y del generador de carga (guias 3.3.1/3.3.2).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      batch-size: 32768
      compression-type: snappy
      properties:
        enable.idempotence: true
        linger.ms: 20
        max.block.ms: 3000
        spring.json.add.type.headers: false
    # Consumidor propio de alertas-fraude (ultimas alertas para la vista).
    # ErrorHandlingDeserializer: un JSON invalido no deja al consumidor en un
    # bucle infinito de errores (guia 3.3.3).
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: cl.duoc.cafeteria.common.evento.AlertaFraudeEvent
        spring.json.trusted.packages: cl.duoc.cafeteria.common.evento
        spring.json.use.type.headers: false
    streams:
      # application-id = consumer group de Kafka Streams (guia 3.1.2).
      application-id: cafeteria-antifraude
      properties:
        # Cada transaccion se procesa exactamente una vez, aunque se caiga
        # la instancia a mitad de camino (lecturas + escrituras atomicas).
        processing.guarantee: exactly_once_v2
        # Un mensaje que no se puede deserializar se registra y se salta.
        default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        # Sin cache: cada actualizacion de una agregacion se emite al instante
        # (la regla de rafaga necesita ver cada conteo, no solo el ultimo).
        statestore.cache.max.bytes: 0
        commit.interval.ms: 1000
        # Topics internos (changelog y repartition): un solo broker.
        replication.factor: ${app.kafka.replicas}

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: true
  # Topics y consumer groups de Kafka (Fase 8). Nombres, particiones y
  # retencion SOLO aqui (KafkaTopicsProperties + KafkaStreamsConfig).
  kafka:
    topics:
      transacciones: cafeteria.pagos.transacciones
      totales: cafeteria.antifraude.totales-por-cliente
      alertas-fraude: alertas-fraude
    group-ids:
      # Consumidor propio de alertas-fraude (distinto del de ms-notificaciones:
      # cada grupo recibe TODAS las alertas, ver docs/EP2_PLAN.md Fase 8).
      monitor: antifraude-monitor
    particiones: 3
    # Un solo broker en Docker Compose / EC2: en produccion seria 3.
    replicas: 1
    retencion-ms:
      transacciones: 604800000   # 7 dias
      alertas-fraude: 2592000000 # 30 dias
  # Reglas de la topologia antifraude (streams/AntifraudeTopology).
  antifraude:
    monto-minimo: 10              # CLP: montos menores se descartan (ruido)
    tasa-clp-usd: 950             # CLP por 1 USD (simulada)
    umbral-alto: 50000            # CLP: sobre esto, alerta ALTA
    max-transacciones-ventana: 5  # mas pagos que esto en la ventana = rafaga
    ventana-minutos: 5
    store-totales: total-por-cliente
    store-rafagas: pagos-por-ventana
    max-alertas-memoria: 200
