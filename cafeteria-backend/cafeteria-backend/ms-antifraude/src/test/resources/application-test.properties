spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/test-tenant/v2.0
AZURE_ISSUER_URI=https://login.microsoftonline.com/test-tenant/v2.0

# Las pruebas no se conectan a un broker real: ni Kafka Streams ni el
# listener arrancan, y no se intenta crear topics.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.streams.auto-startup=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
