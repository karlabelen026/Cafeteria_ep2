spring:
  application:
    name: ms-reportes
  datasource:
    # Cada microservicio usa SU PROPIA base de datos MySQL (la crea y le da
    # permisos el servicio mysql-init de docker-compose.yml). En MySQL,
    # hibernate.default_schema no tiene efecto: la base se elige en la URL.
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/reportes?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:cafeteria}
    password: ${DB_PASSWORD:cafeteria}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # NOTA: issuer-uri / audiences / jwk-set-uri NO se configuran aqui bajo
  # spring.security.oauth2.resourceserver.jwt.* — SecurityConfig.java arma su
  # propio bean JwtDecoder leyendo AZURE_ISSUER_URI / AZURE_JWK_SET_URI /
  # AZURE_AUDIENCES directamente, para decidir en Java (no via propiedades)
  # si usar jwk-set-uri (tenants ciamlogin) o issuer-uri (Azure AD "clasico").
  # Dejar esas propiedades aqui ademas del bean propio hace que Spring Boot
  # intente armar su propio JwtDecoder tambien y falle por bean ambiguo.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:cafeteria}
    password: ${RABBITMQ_PASSWORD:cafeteria}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false
  # Kafka: ms-reportes consume el topic de transacciones de pago con su propio
  # consumer group, en paralelo a ms-antifraude, para la reporteria en tiempo
  # real y la auditoria (ver MetricasTiempoRealService).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Un consumidor por particion dentro del grupo (se ve en Kafka UI -> Consumers).
    listener:
      concurrency: 3
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer envuelve al JsonDeserializer: un JSON invalido
      # no deja al consumidor en un bucle infinito, el registro va a la DLT.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: cl.duoc.cafeteria.common.evento.TransaccionPagoEvent
        spring.json.trusted.packages: cl.duoc.cafeteria.common.evento
        spring.json.use.type.headers: false
    # Solo se usa para publicar en la DLT.
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: true
  rabbitmq:
    exchanges:
      pagos: cafeteria.pagos.exchange
      pedidos: cafeteria.pedidos.exchange
      dlx: cafeteria.dlx
    routing-keys:
      pago-aprobado: pago.aprobado
      pedido-eventos: "pedido.#"
    queues:
      pago-aprobado: reportes.pago-aprobado.queue
      pedido-eventos: reportes.pedido-eventos.queue
    policies:
      delivery-limit: 3
      message-ttl-ms: 600000
      max-length: 10000
      dlq-ttl-ms: 86400000
  # Topics de Kafka. Nombres, grupos y reintentos SOLO aqui (KafkaTopicsProperties
  # + KafkaReportesConfig), igual que app.rabbitmq.
  kafka:
    topics:
      # Lo crea ms-pagos (su productor); aqui solo se consume.
      transacciones: cafeteria.pagos.transacciones
      transacciones-dlt: cafeteria.pagos.transacciones.reportes.DLT
    group-ids:
      # Grupo propio: recibe TODAS las transacciones aunque ms-antifraude
      # tambien las lea con el suyo (cafeteria-antifraude).
      reportes: reportes-tiempo-real
    # La DLT tiene las mismas particiones que el topic principal: el registro
    # fallido va a la misma particion de la que vino.
    particiones: 3
    replicas: 3
    min-insync-replicas: 2
    retencion-ms:
      transacciones-dlt: 1209600000   # 14 dias para revisar los registros fallidos
    reintentos:
      intervalo-inicial-ms: 1000
      multiplicador: 2.0
      maximo: 3                        # reintentos a los 1s, 2s y 4s
