spring:
  application:
    name: ms-reportes
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cafeteria?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:cafeteria}
    password: ${DB_PASSWORD:cafeteria}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: reportes
  # NOTA: issuer-uri / audiences / jwk-set-uri NO se configuran aqui bajo
  # spring.security.oauth2.resourceserver.jwt.* — SecurityConfig.java arma su
  # propio bean JwtDecoder leyendo AZURE_ISSUER_URI / AZURE_JWK_SET_URI /
  # AZURE_AUDIENCES directamente, para decidir en Java (no via propiedades)
  # si usar jwk-set-uri (tenants ciamlogin) o issuer-uri (Azure AD "clasico").
  # Dejar esas propiedades aqui ademas del bean propio hace que Spring Boot
  # intente armar su propio JwtDecoder tambien y falle por bean ambiguo.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:cafeteria}
    password: ${RABBITMQ_PASSWORD:cafeteria}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: true
  rabbitmq:
    exchanges:
      pagos: cafeteria.pagos.exchange
      pedidos: cafeteria.pedidos.exchange
      dlx: cafeteria.dlx
    routing-keys:
      pago-aprobado: pago.aprobado
      pedido-eventos: "pedido.#"
    queues:
      pago-aprobado: reportes.pago-aprobado.queue
      pedido-eventos: reportes.pedido-eventos.queue
    policies:
      delivery-limit: 3
      message-ttl-ms: 600000
      max-length: 10000
      dlq-ttl-ms: 86400000
