spring:
  application:
    name: ms-pagos
  datasource:
    # Cada microservicio usa SU PROPIA base de datos MySQL (la crea y le da
    # permisos el servicio mysql-init de docker-compose.yml). En MySQL,
    # hibernate.default_schema no tiene efecto: la base se elige en la URL.
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/pagos?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:cafeteria}
    password: ${DB_PASSWORD:cafeteria}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # NOTA: issuer-uri / audiences / jwk-set-uri NO se configuran aqui bajo
  # spring.security.oauth2.resourceserver.jwt.* — SecurityConfig.java arma su
  # propio bean JwtDecoder leyendo AZURE_ISSUER_URI / AZURE_JWK_SET_URI /
  # AZURE_AUDIENCES directamente, para decidir en Java (no via propiedades)
  # si usar jwk-set-uri (tenants ciamlogin) o issuer-uri (Azure AD "clasico").
  # Dejar esas propiedades aqui ademas del bean propio hace que Spring Boot
  # intente armar su propio JwtDecoder tambien y falle por bean ambiguo.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:cafeteria}
    password: ${RABBITMQ_PASSWORD:cafeteria}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false
  # Kafka (Fase 8): ms-pagos solo PRODUCE al topic de transacciones, que
  # analiza ms-antifraude con Kafka Streams. Tuning de las guias 3.3.1/3.3.2.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Durabilidad: el lider espera a todas las replicas en sincronia.
      acks: all
      # Throughput: agrupa mensajes en lotes de hasta 32 KB comprimidos.
      batch-size: 32768
      compression-type: snappy
      properties:
        # Sin duplicados aunque el productor reintente un envio.
        enable.idempotence: true
        linger.ms: 20
        # Si Kafka no esta disponible el pago NO debe quedar bloqueado:
        # el envio falla rapido y solo se registra en el log.
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        # El consumidor (Kafka Streams) ya sabe el tipo: no se agregan
        # headers con el nombre de la clase Java.
        spring.json.add.type.headers: false

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: true
  rabbitmq:
    exchanges:
      pedidos: cafeteria.pedidos.exchange
      pagos: cafeteria.pagos.exchange
      dlx: cafeteria.dlx
    routing-keys:
      pedido-creado: pedido.creado
      pago-aprobado: pago.aprobado
      pago-rechazado: pago.rechazado
    queues:
      pedido-creado: pagos.pedido-creado.queue
    policies:
      delivery-limit: 3
      message-ttl-ms: 600000
      max-length: 10000
      dlq-ttl-ms: 86400000
  # Topics de Kafka (Fase 8). Nombre, particiones y retencion SOLO aqui
  # (KafkaTopicsProperties + KafkaConfig), igual que app.rabbitmq.
  kafka:
    topics:
      transacciones: cafeteria.pagos.transacciones
    particiones: 3
    # Un solo broker en Docker Compose / EC2: en produccion seria 3.
    replicas: 1
    retencion-ms:
      transacciones: 604800000   # 7 dias: permite replay del historial
