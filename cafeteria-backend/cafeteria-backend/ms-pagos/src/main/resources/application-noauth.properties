# Perfil de desarrollo SIN autenticacion (solo para probar CRUD/DB localmente).
# Actívalo con: SPRING_PROFILES_ACTIVE=noauth
app.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Base de datos H2 embebida (archivo local ./data/pagos.mv.db), SOLO para el
# perfil noauth. Asi puedes probar el CRUD sin instalar Docker ni Postgres.
# Cuando integres Azure, corre SIN este perfil y se usa Postgres (ver
# application.properties) en su lugar.
spring.datasource.url=jdbc:h2:file:./data/pagos;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=
