spring:
  application:
    name: ms-inventario
  datasource:
    # Cada microservicio usa SU PROPIA base de datos MySQL (la crea y le da
    # permisos el servicio mysql-init de docker-compose.yml). En MySQL,
    # hibernate.default_schema no tiene efecto: la base se elige en la URL.
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/inventario?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:cafeteria}
    password: ${DB_PASSWORD:cafeteria}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # NOTA: issuer-uri / audiences / jwk-set-uri NO se configuran aqui bajo
  # spring.security.oauth2.resourceserver.jwt.* — SecurityConfig.java arma su
  # propio bean JwtDecoder leyendo AZURE_ISSUER_URI / AZURE_JWK_SET_URI /
  # AZURE_AUDIENCES directamente, para decidir en Java (no via propiedades)
  # si usar jwk-set-uri (tenants ciamlogin) o issuer-uri (Azure AD "clasico").
  # Dejar esas propiedades aqui ademas del bean propio hace que Spring Boot
  # intente armar su propio JwtDecoder tambien y falle por bean ambiguo.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:cafeteria}
    password: ${RABBITMQ_PASSWORD:cafeteria}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: true
    # Secreto compartido para llamadas servicio-a-servicio (header
    # X-Internal-Token, ver ms-pedidos InternalTokenFilter). Debe ser el
    # mismo valor en todos los microservicios (variable INTERNAL_API_TOKEN).
    internal-token: ${INTERNAL_API_TOKEN:cafeteria-interno-local}
  clients:
    # URL base de ms-pedidos, usada por PedidoClient para resolver los items
    # de un pedido pagado (ver docs/EP2_PLAN.md seccion 5 y PedidoClient).
    pedidos-url: ${MS_PEDIDOS_URL:http://localhost:8083}
  rabbitmq:
    exchanges:
      pagos: cafeteria.pagos.exchange
      inventario: cafeteria.inventario.exchange
      dlx: cafeteria.dlx
    routing-keys:
      pago-aprobado: pago.aprobado
      stock-bajo: stock.bajo
    queues:
      pago-aprobado: inventario.pago-aprobado.queue
    policies:
      delivery-limit: 3
      message-ttl-ms: 600000
      max-length: 10000
      dlq-ttl-ms: 86400000
