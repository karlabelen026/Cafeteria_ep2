name: Terraform - Deploy a AWS (Academy Lab)

# Disparo SOLO manual: las credenciales de AWS Academy Learner Lab expiran
# cada pocas horas y hay que renovarlas en los secrets del repo antes de
# cada corrida (ver infra/terraform/README.md, sección "CI/CD con GitHub
# Actions"), asi que automatizarlo en cada push fallaria la mayoria de las
# veces y además volvería a aplicar infraestructura real sin que nadie lo
# pidiera.
on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: "Rama que la EC2 clona y corre con docker compose"
        required: false
        default: "deploy"
      replace_target:
        description: "Opcional: direccion de un recurso para forzar su reemplazo (ej. aws_instance.backend), para probar un boot limpio sin perder datos (el volumen EBS de MySQL no es parte de la instancia)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cafeteria360-terraform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Crear/verificar backend remoto (S3 + DynamoDB) e inicializar
        run: ./init-backend.sh

      - name: terraform fmt -check
        run: terraform fmt -check

      - name: terraform plan
        run: |
          if [ -n "${{ github.event.inputs.replace_target }}" ]; then
            terraform plan -input=false -replace="${{ github.event.inputs.replace_target }}" -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi
        env:
          TF_VAR_my_ip_cidr: ${{ secrets.MY_IP_CIDR }}
          TF_VAR_repo_url: https://github.com/${{ github.repository }}.git
          TF_VAR_repo_branch: ${{ github.event.inputs.repo_branch }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_backend_client_id: ${{ secrets.AZURE_BACKEND_CLIENT_ID }}
          TF_VAR_azure_frontend_client_id: ${{ secrets.AZURE_FRONTEND_CLIENT_ID }}
          TF_VAR_azure_issuer_uri: ${{ secrets.AZURE_ISSUER_URI }}
          TF_VAR_azure_jwk_set_uri: ${{ secrets.AZURE_JWK_SET_URI }}
          TF_VAR_azure_authority: ${{ secrets.AZURE_AUTHORITY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_rabbitmq_erlang_cookie: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          TF_VAR_enable_recovery_alarms: ${{ secrets.ENABLE_RECOVERY_ALARMS || 'true' }}

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar outputs en el resumen del job
        run: |
          {
            echo "### Terraform output"
            echo '```'
            terraform output
            echo '```'
            echo
            echo "El primer arranque tarda 10-15 min en compilar todo (ver /var/log/cloud-init-output.log en la EC2)."
          } >> "$GITHUB_STEP_SUMMARY"
