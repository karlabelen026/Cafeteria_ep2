name: Terraform - Deploy a AWS (Academy Lab)

# Disparo SOLO manual: las credenciales de AWS Academy Learner Lab expiran
# cada pocas horas y hay que renovarlas en los secrets del repo antes de
# cada corrida (ver infra/terraform/README.md, sección "CI/CD con GitHub
# Actions"), asi que automatizarlo en cada push fallaria la mayoria de las
# veces y además volvería a aplicar infraestructura real sin que nadie lo
# pidiera.
on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: "Rama que las EC2 clonan (compose de deploy/aws y configuracion)"
        required: false
        default: "deploy"
      backend_image_tag:
        description: "Tag de ghcr.io/<owner>/cafeteria-backend que corre la EC2 de backend (lo publica build-images.yml: nombre de rama, sha-<sha> o latest)"
        required: false
        default: "deploy"
      replace_target:
        description: "Opcional: direccion de uno o mas recursos (separados por coma) para forzar su reemplazo, ej. aws_instance.backend,aws_instance.frontend. Util para probar un boot limpio sin perder datos (el volumen EBS de MySQL no es parte de la instancia) o cuando terraform plan no detecta que una instancia necesita recrearse."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cafeteria360-terraform
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar infraestructura AWS + Docker Compose (backend y frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Crear/verificar backend remoto (S3 + DynamoDB) e inicializar
        run: ./init-backend.sh

      - name: terraform fmt -check
        run: terraform fmt -check

      - name: Imagen del backend en GHCR (el owner va en minusculas)
        run: echo "TF_VAR_backend_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cafeteria-backend:${BACKEND_IMAGE_TAG}" >> "$GITHUB_ENV"
        env:
          BACKEND_IMAGE_TAG: ${{ github.event.inputs.backend_image_tag || 'deploy' }}

      - name: terraform plan
        run: |
          REPLACE_FLAGS=()
          if [ -n "$REPLACE_TARGET" ]; then
            IFS=',' read -ra TARGETS <<< "$REPLACE_TARGET"
            for t in "${TARGETS[@]}"; do
              REPLACE_FLAGS+=(-replace="$t")
            done
          fi
          terraform plan -input=false "${REPLACE_FLAGS[@]}" -out=tfplan
        env:
          REPLACE_TARGET: ${{ github.event.inputs.replace_target }}
          TF_VAR_my_ip_cidr: ${{ secrets.MY_IP_CIDR }}
          TF_VAR_repo_url: https://github.com/${{ github.repository }}.git
          TF_VAR_repo_branch: ${{ github.event.inputs.repo_branch }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_backend_client_id: ${{ secrets.AZURE_BACKEND_CLIENT_ID }}
          TF_VAR_azure_frontend_client_id: ${{ secrets.AZURE_FRONTEND_CLIENT_ID }}
          TF_VAR_azure_issuer_uri: ${{ secrets.AZURE_ISSUER_URI }}
          TF_VAR_azure_jwk_set_uri: ${{ secrets.AZURE_JWK_SET_URI }}
          TF_VAR_azure_authority: ${{ secrets.AZURE_AUTHORITY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_rabbitmq_erlang_cookie: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          TF_VAR_enable_recovery_alarms: ${{ secrets.ENABLE_RECOVERY_ALARMS || 'true' }}
          TF_VAR_duckdns_domain: ${{ secrets.DUCKDNS_DOMAIN }}
          TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}

      - name: terraform apply (crea/actualiza las 4 EC2, el volumen EBS, el API Gateway y el resto de la infraestructura AWS)
        run: terraform apply -input=false -auto-approve tfplan

      - name: Actualizar DuckDNS con la Elastic IP actual del frontend
        run: |
          if [ -z "$DUCKDNS_DOMAIN" ]; then
            echo "DUCKDNS_DOMAIN no esta configurado, se omite (se sigue usando la Elastic IP directamente)."
            exit 0
          fi
          IP=$(terraform output -raw frontend_elastic_ip)
          SUBDOMINIO="${DUCKDNS_DOMAIN%%.*}"
          curl -fsS "https://www.duckdns.org/update?domains=${SUBDOMINIO}&token=${DUCKDNS_TOKEN}&ip=${IP}"
        env:
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}

      - name: Publicar outputs en el resumen del job
        run: |
          {
            echo "### Terraform output"
            echo '```'
            terraform output
            echo '```'
            echo
            echo "**Qué hizo este workflow (CI/CD):**"
            echo "1. Terraform (los pasos de arriba) creó o actualizó la infraestructura AWS: 4 EC2 (frontend, backend, kafka y rabbitmq), el volumen EBS de MySQL y el API Gateway."
            echo "2. Cada EC2 corre sola, al arrancar, un script (\`user_data\`) que instala Docker y levanta su compose: kafka (3 Zookeeper + 3 brokers + Kafka UI), rabbitmq (cluster de 3 nodos), backend (MySQL + 13 servicios con la imagen \`$TF_VAR_backend_image\`, sin compilar) y frontend (nginx con el build de React). Esto es automático, sin SSH ni intervención manual."
            echo
            echo "Tiempos esperados del primer arranque: rabbitmq 1-2 min, kafka unos 2 min, backend 3-5 min (espera a los brokers y baja la imagen), frontend 2-3 min. Se puede seguir con 'sudo tail -f /var/log/cloud-init-output.log' por SSH."
          } >> "$GITHUB_STEP_SUMMARY"
